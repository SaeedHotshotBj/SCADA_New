name: SCADA_New backend and frontend checks

on:
  push:
    branches: ["backend-api", "backend-integrated"]
  pull_request:
    branches: ["main", "rebuild-from-video"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Run backend API tests
        run: PYTHONPATH=. pytest -q tests
      - name: Check frontend JavaScript syntax
        working-directory: .
        run: node scripts/check.mjs
